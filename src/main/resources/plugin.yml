name: WFs_BBFL_Basics
prefix: "WF's BBFL Basics"
version: 1.2.0
author: WarlyFarly
main: dev.whistle.WFsBBFLBasics
api-version: '26.3'
softdepend: [TAB]
description: Basic utilities for BBFL, including the admin Whistle and football matches.
commands:
  bbflbasics:
    description: Administration for WF's BBFL Basics.
    usage: /bbflbasics reload
    permission: wfsbbfl.reload
  whistle:
    description: Gives you the Whistle.
    usage: /whistle
    permission: whistle.give
  match:
    description: Create and manage football matches.
    usage: /match <create|invite|stadium|start|goal|end|leave|accept|decline|watch>
    permission: wfsbbfl.match
  votematch:
    description: Open the quickmatch menu, or vote for a quickmatch on a stadium.
    usage: /quickmatch   or   /votematch <stadium> [minutes]
    aliases: [quickmatch]
    permission: wfsbbfl.votematch
  smashstadium:
    description: Create and edit Smash stadiums (operators only).
    usage: /smashstadium <create|delete|list|info|edit|confirm|bounds|wallpoint1|wallpoint2|wallheight|wallfront>
    permission: wfsbbfl.smashstadium
  challenge:
    description: Open the challenge menu (Duels, Smash, One-Bounce, Color Cover).
    usage: /challenge [accept|decline|start|bypass]
  training:
    description: Open the training menu (Free Play and Dodge) to practise on your own.
    usage: /training
  obstadium:
    description: Create and edit One-Bounce stadiums (operators only).
    usage: /obstadium <create|delete|list|info|setballpos|setradius|bounds|edit|confirm>
    permission: wfsbbfl.obstadium
  ccstadium:
    description: Create and edit Color Cover arenas (operators only).
    usage: /ccstadium <create|delete|list|info|setspawn|bounds|edit|confirm>
    permission: wfsbbfl.ccstadium
  hpstadium:
    description: Create and edit Hot Potato arenas (operators only).
    usage: /hpstadium <create|delete|list|info|setpos|clearpos|bounds|edit|confirm>
    permission: wfsbbfl.hpstadium
  lobby:
    description: Go to the minigames lobby, where a vote picks the next minigame.
    usage: /lobby <minigames|leave>
  setlobby:
    description: Set a lobby location (operators only).
    usage: /setlobby <quickmatch|minigames>
    permission: wfsbbfl.setlobby
  setprefix:
    description: Set the red or blue team name tag prefix (operators only).
    usage: /setprefix <red|blue> <prefix|none>
    permission: wfsbbfl.setprefix
  stadium:
    description: Create stadiums, set centre points and goal areas.
    usage: /stadium <create|delete|list|info|setcentre|setstands|setgoal|goalheight|block|confirm|edit|invite|uninvite|claim|builder|bounds|setpos1|setpos2|setpos3|setpos4|setpos5>
permissions:
  whistle.give:
    description: Allows use of /whistle
    default: op
  wfsbbfl.match:
    description: Allows use of /match
    default: true
  wfsbbfl.match.create:
    description: Allows starting league matches with /match create
    default: op
  wfsbbfl.votematch:
    description: Allows /votematch quickmatch votes
    default: true
  wfsbbfl.bypass:
    description: Allows /match create bypass (create a match with nobody else online)
    default: op
  wfsbbfl.reload:
    description: Allows /bbflbasics reload
    default: op
  wfsbbfl.match.invite.server:
    description: Allows /match invite server (invites the whole Discord server to a match)
    default: op
  wfsbbfl.smashstadium:
    description: Allows /smashstadium
    default: op
  wfsbbfl.obstadium:
    description: Allows /obstadium
    default: op
  wfsbbfl.ccstadium:
    description: Allows /ccstadium
    default: op
  wfsbbfl.hpstadium:
    description: Allows /hpstadium
    default: op
  wfsbbfl.challengebypass:
    description: Allows /challenge bypass
    default: op
  wfsbbfl.setlobby:
    description: Allows /setlobby
    default: op
  wfsbbfl.setprefix:
    description: Allows /setprefix
    default: op
  wfsbbfl.stadium:
    description: Allows /stadium without the LuckPerms builder role
    default: op
  wfsbbfl.stadium.admin:
    description: Allows editing, deleting and managing invites on any stadium, whoever owns it
    default: op
