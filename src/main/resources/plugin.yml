name: WFs_BBFL_Basics
prefix: "WF's BBFL Basics"
version: 1.0.0
author: WarlyFarly
main: dev.whistle.WFsBBFLBasics
api-version: '26.3'
description: Basic utilities for BBFL, including the admin Whistle and football matches.
commands:
  whistle:
    description: Gives you the Whistle.
    usage: /whistle
    permission: whistle.give
  match:
    description: Create and manage football matches.
    usage: /match <create|invite|stadium|start|goal|end|leave|accept|decline>
    permission: wfsbbfl.match
  stadium:
    description: Create stadiums, set centre points and goal areas.
    usage: /stadium <create|delete|list|info|setcentre|setgoal|goalheight|block>
permissions:
  whistle.give:
    description: Allows use of /whistle
    default: op
  wfsbbfl.match:
    description: Allows use of /match
    default: true
  wfsbbfl.bypass:
    description: Allows /match create bypass (create a match with nobody else online)
    default: op
  wfsbbfl.stadium:
    description: Allows /stadium without the LuckPerms builder role
    default: op
